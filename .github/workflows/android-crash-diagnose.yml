name: Android Crash Diagnose

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Build, launch on emulator, capture logcat
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build, install, launch on emulator and capture logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # NOTE: each line below runs as its own independent shell
          # invocation (a `cd` on one line does not persist to the next),
          # so every command must be self-contained from the repo root.
          script: |
            cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell monkey -p com.app.spendee -c android.intent.category.LAUNCHER 1
            sleep 20
            adb logcat -d > logcat_full.txt
            (grep -B 5 -A 80 -E "FATAL EXCEPTION|AndroidRuntime|ReactNativeJS.*[Ee]rror|Caused by" logcat_full.txt || echo "No obvious crash markers found") > logcat_crash.txt
            echo "===== CRASH EXCERPT ====="
            cat logcat_crash.txt

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: |
            logcat_full.txt
            logcat_crash.txt
          retention-days: 7
